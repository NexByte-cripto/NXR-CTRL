name: Build NXR CTRL Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar fontes
        shell: pwsh
        run: |
          $files = @("nxr_gui.py","nxr_service.py","nxr_launcher.py","fps_engine.py","core.py","procore.py","ultra_tools.py","requirements.txt")
          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Arquivos ausentes: $($missing -join ', '). Envie os arquivos da pasta NXR_CTRL_5_2_1_REPARO para a raiz do repositorio."
            exit 1
          }
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Verificar imports
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; app=QApplication([]); import nxr_service; print('Qt e servicos carregados')"
      - name: Compilar EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NXR_CTRL_5_2_1 --collect-all PySide6 nxr_gui.py
      - name: Gerar checksum SHA256
        shell: pwsh
        run: |
          (Get-FileHash dist/NXR_CTRL_5_2_1.exe -Algorithm SHA256).Hash.ToLower() + '  NXR_CTRL_5_2_1.exe' | Out-File -Encoding ascii NXR_CTRL_5_2_1_SHA256.txt
      - name: Guardar executavel
        uses: actions/upload-artifact@v4
        with:
          name: NXR-CTRL-Windows
          path: |
            dist/NXR_CTRL_5_2_1.exe
            NXR_CTRL_5_2_1_SHA256.txt
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v5.2.1 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v5.2.1 dist/NXR_CTRL_5_2_1.exe NXR_CTRL_5_2_1_SHA256.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v5.2.1 dist/NXR_CTRL_5_2_1.exe NXR_CTRL_5_2_1_SHA256.txt --repo $env:GITHUB_REPOSITORY --title "NXR CTRL 5.2.1 Redline" --notes "Executavel Windows experimental de 64 bits, sem assinatura digital."
          }
