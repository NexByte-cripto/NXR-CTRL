name: Compilar NXR CTRL para Windows

on:
  workflow_dispatch:
  push:
    paths:
      - RELEASE_READY.txt

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar ferramentas de compilacao
        run: python -m pip install --upgrade pip brotli pyinstaller
      - name: Restaurar codigo-fonte publicado
        run: python scripts/unpack.py
      - name: Instalar dependencias do aplicativo
        run: python -m pip install -r build_src/requirements.txt
      - name: Teste de importacao da interface Qt
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -c "from PySide6.QtWidgets import QApplication; app=QApplication([]); print('Qt carregado')"
      - name: Compilar executavel portatil
        working-directory: build_src
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NXR_CTRL_5_2_1 --collect-all PySide6 nxr_gui.py
      - name: Publicar artefato da compilacao
        uses: actions/upload-artifact@v4
        with:
          name: NXR_CTRL_5_2_1_Windows
          path: build_src/dist/NXR_CTRL_5_2_1.exe
      - name: Gerar hashes SHA256
        shell: pwsh
        run: |
          (Get-FileHash build_src/dist/NXR_CTRL_5_2_1.exe -Algorithm SHA256).Hash.ToLower() + '  NXR_CTRL_5_2_1.exe' | Out-File -Encoding ascii NXR_CTRL_5_2_1_SHA256.txt
      - name: Publicar versao para download direto
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v5.2.1 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete v5.2.1 --repo $env:GITHUB_REPOSITORY --yes }
          gh release create v5.2.1 build_src/dist/NXR_CTRL_5_2_1.exe NXR_CTRL_5_2_1_SHA256.txt --repo $env:GITHUB_REPOSITORY --title 'NXR CTRL 5.2.1 Redline' --notes 'Executavel Windows 64 bits, compilado automaticamente a partir do projeto. Teste inicialmente sem privilegios de administrador. Software experimental e nao assinado digitalmente.'
