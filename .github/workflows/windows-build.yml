name: Build NXR CTRL Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/nxr_5_2_1.tar.br.base64'
      - 'scripts/unpack.py'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar compilador e descompactador
        run: python -m pip install pyinstaller brotli
      - name: Restaurar codigo fonte diretamente do GitHub
        run: python scripts/unpack.py
      - name: Conferir arquivos de entrada
        shell: pwsh
        run: |
          $required = @("nxr_gui.py","nxr_service.py","core.py","fps_engine.py","procore.py","ultra_tools.py","requirements.txt")
          foreach ($f in $required) { if (-not (Test-Path $f)) { throw "Arquivo ausente: $f" } }
      - name: Instalar dependencias do aplicativo
        run: python -m pip install -r requirements.txt
      - name: Testar inicializacao Qt sem monitor
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; app=QApplication([]); import nxr_service; print('Qt e servicos carregados')"
      - name: Gerar exe portatil
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NXR_CTRL_5_2_1 --collect-all PySide6 nxr_gui.py
      - name: Hash SHA256
        shell: pwsh
        run: |
          (Get-FileHash dist/NXR_CTRL_5_2_1.exe -Algorithm SHA256).Hash.ToLower() + '  NXR_CTRL_5_2_1.exe' | Out-File -Encoding ascii NXR_CTRL_5_2_1_SHA256.txt
      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: NXR-CTRL-Windows
          path: |
            dist/NXR_CTRL_5_2_1.exe
            NXR_CTRL_5_2_1_SHA256.txt
      - name: Publicar versao
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v5.2.1 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v5.2.1 dist/NXR_CTRL_5_2_1.exe NXR_CTRL_5_2_1_SHA256.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v5.2.1 dist/NXR_CTRL_5_2_1.exe NXR_CTRL_5_2_1_SHA256.txt --repo $env:GITHUB_REPOSITORY --title "NXR CTRL 5.2.1 Redline" --notes "Aplicativo experimental Windows 64 bits. Sem assinatura digital; validacao em hardware real ainda pendente."
          }
