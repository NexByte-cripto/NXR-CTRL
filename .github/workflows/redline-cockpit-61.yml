name: NXR CTRL 6.1 Redline Cockpit Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/nxr_6_1.tar.br.base64'
      - 'scripts/unpack61.py'
      - '.github/workflows/redline-cockpit-61.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check pyinstaller brotli pytest
      - name: Restore Redline Cockpit source
        run: python scripts/unpack61.py
      - name: Check entrypoints
        shell: pwsh
        run: |
          $required = @("nxr_gui.py","nxr_cockpit.py","nxr_service.py","nxr_commands.py","core.py","ultra_tools.py","requirements.txt","tests/smoke_qt.py")
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing source: $f" } }
      - name: Install app requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run core regression tests
        run: python -m pytest tests -q
      - name: Qt offscreen smoke test and visual screenshot
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM="offscreen"
          $env:PYTHONPATH=(Get-Location).Path
          python tests/smoke_qt.py
      - name: Publish visual proof of redesign
        uses: actions/upload-artifact@v4
        with:
          name: NXR-CTRL-6.1-REAL-DASHBOARD
          path: NXR_CTRL_6_1_REAL_PREVIEW.png
          if-no-files-found: error
      - name: Compile Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NXR_CTRL_6_1 --collect-all PySide6 --hidden-import nxr_cockpit --hidden-import nxr_commands --hidden-import nxr_advanced nxr_gui.py
      - name: SHA256 checksum
        shell: pwsh
        run: |
          (Get-FileHash dist/NXR_CTRL_6_1.exe -Algorithm SHA256).Hash.ToLower() + '  NXR_CTRL_6_1.exe' | Out-File -Encoding ascii NXR_CTRL_6_1_SHA256.txt
      - name: Upload compiled exe
        uses: actions/upload-artifact@v4
        with:
          name: NXR-CTRL-6.1-WINDOWS
          path: |
            dist/NXR_CTRL_6_1.exe
            NXR_CTRL_6_1_SHA256.txt
          if-no-files-found: error
      - name: Create official release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v6.1.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v6.1.0 dist/NXR_CTRL_6_1.exe NXR_CTRL_6_1_SHA256.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v6.1.0 dist/NXR_CTRL_6_1.exe NXR_CTRL_6_1_SHA256.txt --repo $env:GITHUB_REPOSITORY --title "NXR CTRL 6.1 - Redline Cockpit" --notes "Interface PySide6 totalmente refeita: rail de 74px, navegacao horizontal, instrumentos de telemetria, 13 telas, controles reais auditaveis. Experimental, sem assinatura digital e sem overclock direto."
          }
